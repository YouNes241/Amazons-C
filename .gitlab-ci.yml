stages:
  - lint
  - build

format-check:
  stage: lint
  script:
    - clang-format --version
    - find . -name '*.c' -o -name '*.h' | xargs -r clang-format -style=file --Werror --dry-run

compile-check:
  stage: build
  script:
    - cmake -B build -S . -DENABLE_COVERAGE=OFF
    - cmake --build build --parallel $(nproc)
    - cp build/amazon_game .