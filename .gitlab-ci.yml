stages:
  - lint
  - build

format-check:
  stage: lint
  image: amazons-builder:latest # Private image located in VM. Contains all libraries.
  script:
    - clang-format --version
    - >
      if ! find . -name '*.c' -o -name '*.h' | xargs -r clang-format -style=file --Werror --dry-run; then
        echo "Code format check failed. Please run clang-format on your code.";
        exit 1;
      fi
    - echo "Code format check passed."

compile-check:
  stage: build
  image: amazons-builder:latest
  cache:
    key: "compile-cache"
    paths:
      - libs/ # This is done especially for tensorflow which holds about 1GB of data // downloads 300 mb.
    policy: pull-push
  script:
    - mkdir -p libs
    #may have to add a line for tf later.
    - mkdir -p coverage
    - cd coverage
    - cmake -DCMAKE_BUILD_TYPE=Coverage ..
    - make
    - make test
    - make coverage
