stages:
  - lint
  - build

format-check:
  stage: lint
  image: alpine:latest
  before_script:
    - apk add --no-cache clang-extra-tools
  script:
    - clang-format --version
    - >
      if ! find . -name '*.c' -o -name '*.h' | xargs -r clang-format -style=file --Werror --dry-run; then
        echo "Code format check failed. Please run clang-format on your code.";
        exit 1;
      fi
    - echo "Code format check passed."

compile-check:
  stage: build
  #We need arm64 to compile tensorflow
  image: arm64v8/ubuntu:latest

  cache:
    key: "compile-cache"
    paths:
      - libs/ # This is done especially for tensorflow which holds about 1GB of data // downloads 300 mb.
    policy: pull-push
  before_script:
      - apt-get update && apt-get install -y build-essential cmake libgtk-4-dev libgtest-dev libgmock-dev googletest doxygen graphviz gcovr gettext
  
  script:
    - mkdir -p libs
    - make -j$(nproc) all
    # -j$(nproc) allows make to use all available CPU cores for faster compilation.